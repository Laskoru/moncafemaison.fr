# Vérifie à chaque push et pull request que le site se construit et
# qu'aucun lien interne n'est cassé (scripts/check-links.mjs).
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check-links
