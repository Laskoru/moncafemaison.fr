# Publication automatique Pinterest : chaque matin, met à jour les flux RSS public/pinterest/*.xml
# avec les épingles du jour (voir scripts/pinterest-feed.mjs). Pinterest lit ces flux et publie seul.
# Un commit n'est créé que si un flux change ; Vercel redéploie alors le site.
name: Flux Pinterest

on:
  schedule:
    - cron: '7 4 * * *' # vers 6 h à Paris en été, 5 h en hiver
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinterest-feed.yml'
      - 'scripts/pinterest-feed.mjs'

permissions:
  contents: write

concurrency:
  group: pinterest-feed
  cancel-in-progress: false

jobs:
  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Épingles du jour
        run: node scripts/pinterest-feed.mjs
      - name: Commit et push si un flux a changé
        run: |
          git add public/pinterest pinterest/published.json
          if git diff --cached --quiet; then
            echo "Aucun flux modifié."
            exit 0
          fi
          git -c user.name=Laskoru -c user.email=hugo_burel@hotmail.com commit -m "Flux Pinterest : épingles du jour"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
